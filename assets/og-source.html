<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SyncEngine OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0a0a0d;
    color: #fafafa;
    font-family: 'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    position: relative; width: 1200px; height: 630px;
    overflow: hidden;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 100px;
    background: #0a0a0d url('og-bg.webp') center / cover no-repeat;
  }
  /* grain */
  .grain {
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.55; mix-blend-mode: overlay;
  }
  .content { position: relative; z-index: 2; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #a5b4fc;
    margin-bottom: 26px;
  }
  .eyebrow .dot {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: #f472b6;
    box-shadow: 0 0 14px rgba(244,114,182,0.9);
    vertical-align: middle; margin-right: 14px; transform: translateY(-1px);
  }
  h1 {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 96px;
    line-height: 1.0;
    letter-spacing: -0.04em;
    color: #fafafa;
    margin-bottom: 22px;
  }
  h1 .grad {
    background: linear-gradient(120deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .lead {
    font-family: 'Source Serif 4', Georgia, serif;
    font-style: italic;
    font-size: 32px; line-height: 1.35;
    color: #a0a0ab;
    max-width: 820px;
    font-weight: 400;
  }
  .footer {
    position: absolute; bottom: 56px; left: 100px; right: 100px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; letter-spacing: 0.18em;
    text-transform: uppercase; color: #52525b;
    z-index: 2;
  }
  .footer .url { color: #8b8b96; }
  .glyph {
    display: inline-flex; align-items: center; gap: 12px;
  }
  .ring {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid #818cf8;
    position: relative;
  }
  .ring::after {
    content: ''; position: absolute; inset: 4px;
    border-radius: 50%; background: linear-gradient(135deg, #818cf8, #f472b6);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="grain"></div>
    <div class="content">
      <div class="eyebrow"><span class="dot"></span>SyncEngine</div>
      <h1>What if regeneration<br><span class="grad">was a game?</span></h1>
      <div class="lead">A cooperative competition to build a more beautiful world — played on your devices, scored in the real world.</div>
    </div>
    <div class="footer">
      <div class="glyph"><span class="ring"></span><span>syncengine.earth</span></div>
      <div class="url">protocol · network · gift cycle</div>
    </div>
  </div>
</body>
</html>
