<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="rw-center" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="275" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#9aa0a6">Three-Property Positioning</text>

  <!-- Circle A: Conservation Law (green, top) -->
  <circle cx="275" cy="155" r="120" fill="#e8f5e9" fill-opacity="0.45" stroke="#34a853" stroke-width="2"/>
  <text x="275" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e8e3e">Conservation Law</text>

  <!-- Circle B: Local Enforcement (blue, bottom-left) -->
  <circle cx="205" cy="250" r="120" fill="#e8f0fe" fill-opacity="0.45" stroke="#4285f4" stroke-width="2"/>
  <text x="115" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a73e8">Local Enforcement</text>

  <!-- Circle C: BFT Certificates (purple, bottom-right) -->
  <circle cx="345" cy="250" r="120" fill="#f3e5f5" fill-opacity="0.45" stroke="#7b1fa2" stroke-width="2"/>
  <text x="435" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#6a1b9a">BFT Certificates</text>

  <!-- Center: Attention Ledger (A ∩ B ∩ C) -->
  <circle cx="275" cy="215" r="24" fill="url(#rw-center)" stroke="#f9ab00" stroke-width="2.5"/>
  <text x="275" y="211" text-anchor="middle" font-size="8" font-weight="bold" fill="#e65100">Attention</text>
  <text x="275" y="222" text-anchor="middle" font-size="8" font-weight="bold" fill="#e65100">Ledger</text>

  <!-- Holochain: B only (local, no conservation, no BFT) -->
  <circle cx="160" cy="280" r="6" fill="#4285f4" opacity="0.7"/>
  <text x="160" y="296" text-anchor="middle" font-size="9" fill="#1a73e8">Holochain</text>

  <!-- SSB: B only -->
  <circle cx="195" cy="310" r="6" fill="#4285f4" opacity="0.7"/>
  <text x="195" y="326" text-anchor="middle" font-size="9" fill="#1a73e8">SSB</text>

  <!-- CRDTs: B only -->
  <circle cx="140" cy="240" r="6" fill="#4285f4" opacity="0.7"/>
  <text x="140" y="256" text-anchor="middle" font-size="9" fill="#1a73e8">CRDTs</text>

  <!-- PBFT/Tendermint: C only (BFT, not local, no conservation) -->
  <circle cx="400" cy="280" r="6" fill="#7b1fa2" opacity="0.7"/>
  <text x="400" y="296" text-anchor="middle" font-size="9" fill="#6a1b9a">PBFT</text>

  <circle cx="420" cy="240" r="6" fill="#7b1fa2" opacity="0.7"/>
  <text x="420" y="256" text-anchor="middle" font-size="9" fill="#6a1b9a">Tendermint</text>

  <!-- Hashgraph: near B∩C (gossip + virtual voting) -->
  <circle cx="345" cy="310" r="6" fill="#ce93d8" opacity="0.7"/>
  <text x="345" y="326" text-anchor="middle" font-size="9" fill="#6a1b9a">Hashgraph</text>

  <!-- Bottom annotation -->
  <rect x="100" y="368" width="350" height="24" rx="6" fill="#fff3e0" stroke="#f9ab00" stroke-width="1"/>
  <text x="275" y="384" text-anchor="middle" font-size="10" fill="#e65100">Only the attention ledger occupies the <tspan font-weight="bold">center intersection</tspan>.</text>
</svg>