<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 12 8" refX="12" refY="4" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 4 L 0 8 z" fill="#5f6368"/>
    </marker>
    <marker id="arr-recycle" viewBox="0 0 12 8" refX="12" refY="4" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 4 L 0 8 z" fill="#7b1fa2"/>
    </marker>
    <linearGradient id="g-intention" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8eaf6"/>
      <stop offset="100%" stop-color="#c5cae9"/>
    </linearGradient>
    <linearGradient id="g-focus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="g-battery" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="g-blessing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
    <linearGradient id="g-token" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#d2e3fc"/>
    </linearGradient>
    <linearGradient id="g-recycle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </linearGradient>
  </defs>

  <!-- ══ TOP ROW ══ -->

  <!-- 1. Intention Created -->
  <rect x="20" y="20" width="150" height="90" rx="8" fill="url(#g-intention)" stroke="#3f51b5" stroke-width="1.5"/>
  <text x="95" y="46" text-anchor="middle" font-size="13" font-weight="bold" fill="#283593">Intention</text>
  <text x="95" y="64" text-anchor="middle" font-size="10" fill="#5f6368">Someone creates</text>
  <text x="95" y="78" text-anchor="middle" font-size="10" fill="#5f6368">a quest or project</text>
  <text x="95" y="98" text-anchor="middle" font-size="9" fill="#9aa0a6">ArtifactId</text>

  <!-- Arrow 1→2 -->
  <line x1="170" y1="65" x2="208" y2="65" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2. Attention Focused -->
  <rect x="216" y="20" width="150" height="90" rx="8" fill="url(#g-focus)" stroke="#f57c00" stroke-width="1.5"/>
  <text x="291" y="46" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">Focus</text>
  <text x="291" y="64" text-anchor="middle" font-size="10" fill="#5f6368">Members point their</text>
  <text x="291" y="78" text-anchor="middle" font-size="10" fill="#5f6368">attention at it</text>
  <text x="291" y="98" text-anchor="middle" font-size="9" fill="#9aa0a6">AttentionSwitchEvent</text>

  <!-- Arrow 2→3 -->
  <line x1="366" y1="65" x2="404" y2="65" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3. Battery Charges -->
  <rect x="412" y="20" width="150" height="90" rx="8" fill="url(#g-battery)" stroke="#34a853" stroke-width="1.5"/>
  <text x="487" y="46" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8e3e">Battery</text>
  <text x="487" y="64" text-anchor="middle" font-size="10" fill="#5f6368">Duration charges</text>
  <text x="487" y="78" text-anchor="middle" font-size="10" fill="#5f6368">over time</text>
  <text x="487" y="98" text-anchor="middle" font-size="9" fill="#9aa0a6">compute_attention_millis()</text>

  <!-- Arrow 3 ↓ (top-right to bottom-right) -->
  <line x1="487" y1="110" x2="487" y2="148" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ BOTTOM ROW (right to left) ══ -->

  <!-- 4. Blessing -->
  <rect x="412" y="156" width="150" height="90" rx="8" fill="url(#g-blessing)" stroke="#c62828" stroke-width="1.5"/>
  <text x="487" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#b71c1c">Blessing</text>
  <text x="487" y="200" text-anchor="middle" font-size="10" fill="#5f6368">Contribution is</text>
  <text x="487" y="214" text-anchor="middle" font-size="10" fill="#5f6368">acknowledged</text>
  <text x="487" y="234" text-anchor="middle" font-size="9" fill="#9aa0a6">× liveness freshness</text>

  <!-- Arrow 4→5 (right to left) -->
  <line x1="412" y1="201" x2="374" y2="201" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 5. Token Minted -->
  <rect x="216" y="156" width="150" height="90" rx="8" fill="url(#g-token)" stroke="#4285f4" stroke-width="1.5"/>
  <text x="291" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a73e8">Token</text>
  <text x="291" y="200" text-anchor="middle" font-size="10" fill="#5f6368">Gratitude released</text>
  <text x="291" y="214" text-anchor="middle" font-size="10" fill="#5f6368">to the manifester</text>
  <text x="291" y="234" text-anchor="middle" font-size="9" fill="#9aa0a6">TokenOfGratitude</text>

  <!-- Arrow 5→6 (right to left) -->
  <line x1="216" y1="201" x2="178" y2="201" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 6. Recycle -->
  <rect x="20" y="156" width="150" height="90" rx="8" fill="url(#g-recycle)" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="95" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a1b9a">Recycle</text>
  <text x="95" y="200" text-anchor="middle" font-size="10" fill="#5f6368">Manifester invests</text>
  <text x="95" y="214" text-anchor="middle" font-size="10" fill="#5f6368">in new intentions</text>
  <text x="95" y="234" text-anchor="middle" font-size="9" fill="#9aa0a6">New quest created</text>

  <!-- Arrow 6→1 (bottom-left back up to top-left) -->
  <path d="M 46 156 L 46 135 Q 46 125 56 125 L 75 125 Q 85 125 85 115 L 85 110" stroke="#7b1fa2" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arr-recycle)"/>
  <text x="22" y="132" font-size="8" fill="#7b1fa2" font-style="italic">cycle renews</text>

  <!-- ══ BOTTOM NOTES ══ -->
  <text x="20" y="280" font-size="10" fill="#9aa0a6">Conservation law: total attention always equals active participants.</text>
  <text x="20" y="295" font-size="10" fill="#9aa0a6">All events hash-chained with PQ signatures and quorum certificates.</text>
  <text x="20" y="310" font-size="10" fill="#9aa0a6">Sybil accounts can't attend in-person events → zero liveness → zero token weight.</text>
</svg>
