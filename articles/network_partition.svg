<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 240" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="np-arr" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#5f6368"/>
    </marker>
    <linearGradient id="np-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#eef0f2"/>
    </linearGradient>
  </defs>

  <!-- Panel 1: Connected -->
  <rect x="10" y="30" width="190" height="170" rx="8" fill="url(#np-panel)" stroke="#dadce0" stroke-width="1.5"/>
  <text x="105" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a73e8">t₀ Connected</text>

  <!-- 6 nodes in cluster -->
  <circle cx="65" cy="80" r="12" fill="#c6dafc" stroke="#4285f4" stroke-width="1.5"/>
  <text x="65" y="84" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a73e8">A</text>
  <circle cx="145" cy="75" r="12" fill="#c6dafc" stroke="#4285f4" stroke-width="1.5"/>
  <text x="145" y="79" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a73e8">B</text>
  <circle cx="55" cy="130" r="12" fill="#c6dafc" stroke="#4285f4" stroke-width="1.5"/>
  <text x="55" y="134" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a73e8">C</text>
  <circle cx="110" cy="110" r="12" fill="#c6dafc" stroke="#4285f4" stroke-width="1.5"/>
  <text x="110" y="114" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a73e8">D</text>
  <circle cx="155" cy="135" r="12" fill="#c6dafc" stroke="#4285f4" stroke-width="1.5"/>
  <text x="155" y="139" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a73e8">E</text>
  <circle cx="105" cy="165" r="12" fill="#c6dafc" stroke="#4285f4" stroke-width="1.5"/>
  <text x="105" y="169" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a73e8">F</text>

  <!-- Edges -->
  <line x1="77" y1="80" x2="133" y2="75" stroke="#4285f4" stroke-width="1" opacity="0.4"/>
  <line x1="65" y1="92" x2="55" y2="118" stroke="#4285f4" stroke-width="1" opacity="0.4"/>
  <line x1="75" y1="87" x2="100" y2="103" stroke="#4285f4" stroke-width="1" opacity="0.4"/>
  <line x1="122" y1="110" x2="143" y2="130" stroke="#4285f4" stroke-width="1" opacity="0.4"/>
  <line x1="140" y1="82" x2="118" y2="103" stroke="#4285f4" stroke-width="1" opacity="0.4"/>
  <line x1="67" y1="135" x2="93" y2="160" stroke="#4285f4" stroke-width="1" opacity="0.4"/>
  <line x1="115" y1="120" x2="108" y2="153" stroke="#4285f4" stroke-width="1" opacity="0.4"/>

  <!-- Total label -->
  <rect x="55" y="185" width="100" height="20" rx="4" fill="#e8f0fe" stroke="#4285f4" stroke-width="1"/>
  <text x="105" y="199" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a73e8">Total = 6</text>

  <!-- Arrow to panel 2 -->
  <line x1="200" y1="115" x2="222" y2="115" stroke="#5f6368" stroke-width="1.5" marker-end="url(#np-arr)"/>

  <!-- Panel 2: Partitioned -->
  <rect x="230" y="30" width="190" height="170" rx="8" fill="url(#np-panel)" stroke="#dadce0" stroke-width="1.5"/>
  <text x="325" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#d93025">t₁ Partitioned</text>

  <!-- Partition line -->
  <line x1="325" y1="40" x2="325" y2="190" stroke="#d93025" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>

  <!-- Left partition: A, C, D, F -->
  <circle cx="270" cy="72" r="12" fill="#c6dafc" stroke="#4285f4" stroke-width="1.5"/>
  <text x="270" y="76" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a73e8">A</text>
  <circle cx="260" cy="120" r="12" fill="#c6dafc" stroke="#4285f4" stroke-width="1.5"/>
  <text x="260" y="124" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a73e8">C</text>
  <circle cx="300" cy="96" r="12" fill="#c6dafc" stroke="#4285f4" stroke-width="1.5"/>
  <text x="300" y="100" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a73e8">D</text>
  <circle cx="280" cy="155" r="12" fill="#c6dafc" stroke="#4285f4" stroke-width="1.5"/>
  <text x="280" y="159" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a73e8">F</text>
  <line x1="280" y1="76" x2="294" y2="90" stroke="#4285f4" stroke-width="1" opacity="0.4"/>
  <line x1="268" y1="110" x2="275" y2="80" stroke="#4285f4" stroke-width="1" opacity="0.4"/>

  <text x="278" y="178" text-anchor="middle" font-size="9" fill="#1a73e8">Σ = 4</text>

  <!-- Right partition: B, E -->
  <circle cx="365" cy="85" r="12" fill="#f8cecc" stroke="#d93025" stroke-width="1.5"/>
  <text x="365" y="89" text-anchor="middle" font-size="9" font-weight="bold" fill="#c5221f">B</text>
  <circle cx="385" cy="130" r="12" fill="#f8cecc" stroke="#d93025" stroke-width="1.5"/>
  <text x="385" y="134" text-anchor="middle" font-size="9" font-weight="bold" fill="#c5221f">E</text>
  <line x1="372" y1="94" x2="380" y2="120" stroke="#d93025" stroke-width="1" opacity="0.4"/>

  <text x="375" y="165" text-anchor="middle" font-size="9" fill="#c5221f">Σ = 2</text>
  <text x="375" y="178" text-anchor="middle" font-size="8" fill="#9aa0a6">Observed</text>

  <!-- Arrow to panel 3 -->
  <line x1="420" y1="115" x2="442" y2="115" stroke="#5f6368" stroke-width="1.5" marker-end="url(#np-arr)"/>

  <!-- Panel 3: Reconnected -->
  <rect x="450" y="30" width="190" height="170" rx="8" fill="url(#np-panel)" stroke="#dadce0" stroke-width="1.5"/>
  <text x="545" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e8e3e">t₂ Reconnected</text>

  <!-- All 6 nodes reunited -->
  <circle cx="495" cy="78" r="12" fill="#c8e6c9" stroke="#34a853" stroke-width="1.5"/>
  <text x="495" y="82" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e8e3e">A</text>
  <circle cx="575" cy="72" r="12" fill="#c8e6c9" stroke="#34a853" stroke-width="1.5"/>
  <text x="575" y="76" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e8e3e">B</text>
  <circle cx="485" cy="128" r="12" fill="#c8e6c9" stroke="#34a853" stroke-width="1.5"/>
  <text x="485" y="132" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e8e3e">C</text>
  <circle cx="540" cy="105" r="12" fill="#c8e6c9" stroke="#34a853" stroke-width="1.5"/>
  <text x="540" y="109" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e8e3e">D</text>
  <circle cx="590" cy="130" r="12" fill="#c8e6c9" stroke="#34a853" stroke-width="1.5"/>
  <text x="590" y="134" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e8e3e">E</text>
  <circle cx="540" cy="158" r="12" fill="#c8e6c9" stroke="#34a853" stroke-width="1.5"/>
  <text x="540" y="162" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e8e3e">F</text>

  <!-- Reconnection edges -->
  <line x1="507" y1="78" x2="528" y2="100" stroke="#34a853" stroke-width="1" opacity="0.4"/>
  <line x1="563" y1="72" x2="550" y2="97" stroke="#34a853" stroke-width="1" opacity="0.4"/>
  <line x1="495" y1="120" x2="530" y2="108" stroke="#34a853" stroke-width="1" opacity="0.4"/>
  <line x1="552" y1="110" x2="582" y2="122" stroke="#34a853" stroke-width="1" opacity="0.4"/>
  <line x1="540" y1="117" x2="540" y2="146" stroke="#34a853" stroke-width="1" opacity="0.4"/>

  <!-- CRDT merge label -->
  <text x="545" y="176" text-anchor="middle" font-size="8" fill="#7b1fa2" font-style="italic">CRDT merge</text>

  <!-- Total restored -->
  <rect x="495" y="185" width="100" height="20" rx="4" fill="#e8f5e9" stroke="#34a853" stroke-width="1"/>
  <text x="545" y="199" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e8e3e">Total = 6 ✓</text>

  <!-- Bottom annotation -->
  <text x="325" y="228" text-anchor="middle" font-size="10" fill="#9aa0a6">Conservation holds <tspan font-weight="bold" fill="#b0b5ba">locally</tspan> during partition. CRDTs guarantee <tspan font-weight="bold" fill="#b0b5ba">convergence</tspan> on reconnection.</text>
</svg>